# Quality gates from docs/plan/10-code-quality-and-conventions.md §8. Every job is a required check.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "17"

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            backend
            frontend
            catalog
            cart
            search
            auth
            db
            docker
            ci
            docs
          requireScope: false

  backend:
    name: Backend (lint, unit, IT, coverage, SpotBugs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Verify (Spotless, Checkstyle, tests, JaCoCo gates, SpotBugs)
        run: ./mvnw -B -ntp verify
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/spotbugsXml.xml
            backend/target/checkstyle-result.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (format, lint, types, tests, build, bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Format, lint, typecheck, test with coverage, build, bundle budget
        run: npm run ci
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  docs:
    name: Docs (markdownlint, Mermaid, links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            *.md
            docs/**/*.md
            backend/*.md
            frontend/*.md
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Render every Mermaid diagram
        run: .github/scripts/check-mermaid.sh
      - name: Check relative links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --include-fragments --no-progress
            README.md docs/ backend/README.md frontend/README.md
          fail: true

  e2e:
    name: E2E (compose stack + Playwright) and image checks
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build images and start the stack
        run: docker compose -f compose.yaml -f compose.e2e.yaml up -d --build --wait --wait-timeout 240
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test
      - name: Image checks (non-root user, no secrets in history)
        run: .github/scripts/check-images.sh "plantshop/backend:${IMAGE_TAG}" "plantshop/frontend:${IMAGE_TAG}"
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f compose.e2e.yaml down -v
