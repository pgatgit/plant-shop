version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(backend)" }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(frontend)" }
    groups:
      eslint:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "@vitest/eslint-plugin"]
      testing:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "msw", "@playwright/test", "@axe-core/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(ci)" }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(docker)" }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(docker)" }
