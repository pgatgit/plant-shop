openapi: 3.0.1
info:
  description: "Catalog, name search and cart for the Plant Shop. Errors use RFC 9457\
    \ Problem Details with a stable `code` property."
  license:
    name: Proprietary
  title: Plant Shop API
  version: v1
servers:
- description: Local
  url: http://127.0.0.1:8080
security:
- oauth2: []
tags:
- description: The signed-in shopper's cart
  name: Cart
- description: The signed-in shopper
  name: Account
- description: GitHub sign-in support
  name: Auth
- description: Browse and search the plant catalog
  name: Catalog
paths:
  /api/v1/auth/token:
    post:
      description: OAuth 2.0 token endpoint for the SPA and Swagger UI (Authorization
        Code + PKCE). The backend adds the GitHub client secret and forwards the request
        to GitHub. Errors use RFC 6749 §5.2 JSON. Rate limited per client IP.
      operationId: exchangeToken
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: The GitHub access token
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
          description: "Invalid request, client, grant or grant type"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many token requests from this client
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
          description: GitHub could not be reached
      security: []
      summary: Exchange a GitHub authorization code for an access token
      tags:
      - Auth
  /api/v1/cart:
    get:
      description: Returns the cart with **current** prices and stock. An empty cart
        is returned if the shopper has never added anything. Requires scope `cart.read`.
      operationId: getCart
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
          description: The cart
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid access token
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Token lacks scope cart.read
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The identity provider could not validate the token
      summary: Get the cart
      tags:
      - Cart
  /api/v1/cart/items:
    post:
      description: "Adds `quantity` (default 1) of a product. If the product is already\
        \ in the cart its line is increased. A line may hold at most min(stock, 10).\
        \ Requires scope `cart.write`."
      operationId: addCartItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
          description: The updated cart
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid body (`validation-failed`, `malformed-request`)"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid access token
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Token lacks scope cart.write
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: '`product-not-found`'
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "`out-of-stock`, `quantity-limit-exceeded` (with `limit`, `requested`,\
            \ `productId`) or `concurrent-modification`; the cart is unchanged"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The identity provider could not validate the token
      summary: Add a product to the cart
      tags:
      - Cart
  /api/v1/cart/items/{productId}:
    delete:
      description: Removes the product's line from the cart. Requires scope `cart.write`.
      operationId: removeCartItem
      parameters:
      - description: Product id of the line
        in: path
        name: productId
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: true
          minimum: 0
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
          description: The updated cart
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid product id
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid access token
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Token lacks scope cart.write
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: '`cart-item-not-found`'
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: '`concurrent-modification`'
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The identity provider could not validate the token
      summary: Remove a line
      tags:
      - Cart
    patch:
      description: "Sets the quantity of the product's line (1–10). Decreasing is\
        \ always allowed; increasing is limited to min(stock, 10). Requires scope\
        \ `cart.write`."
      operationId: updateCartItem
      parameters:
      - description: Product id of the line
        in: path
        name: productId
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: true
          minimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
          description: The updated cart
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid body or product id
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid access token
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Token lacks scope cart.write
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: '`cart-item-not-found`'
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "`out-of-stock`, `quantity-limit-exceeded` or `concurrent-modification`;\
            \ the cart is unchanged"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The identity provider could not validate the token
      summary: Change a line's quantity
      tags:
      - Cart
  /api/v1/me:
    get:
      description: Requires any valid access token.
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: The signed-in shopper
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid access token
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The identity provider could not validate the token
      summary: Get the signed-in shopper
      tags:
      - Account
  /api/v1/products:
    get:
      description: "Returns one page of products. With `q`, only products whose name\
        \ **starts with** the term are returned, ignoring case and accents. Requires\
        \ scope `catalog.read`."
      operationId: listProducts
      parameters:
      - description: 0-based page index
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: Page size (1–48)
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 12
          maximum: 48
          minimum: 1
      - description: Ordering
        in: query
        name: sort
        required: false
        schema:
          type: string
          default: "name,asc"
          enum:
          - "name,asc"
          - "name,desc"
          - "price,asc"
          - "price,desc"
      - description: Name prefix to search for. Trimmed and whitespace-collapsed;
          2–50 characters after normalisation. Blank means no search.
        in: query
        name: q
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseProduct"
          description: A page of products
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid paging, sort or search parameter"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Missing or invalid access token
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Token lacks scope catalog.read
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The identity provider could not validate the token
      summary: List or search products
      tags:
      - Catalog
components:
  schemas:
    AddCartItemRequest:
      type: object
      properties:
        productId:
          type: integer
          format: int64
          example: 11
          exclusiveMinimum: true
          minimum: 0
        quantity:
          type: integer
          format: int32
          default: 1
          example: 1
          maximum: 10
          minimum: 1
      required:
      - productId
    Cart:
      type: object
      properties:
        currency:
          type: string
          enum:
          - USD
          example: USD
        itemCount:
          type: integer
          format: int32
          example: 2
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal:
          type: string
          format: decimal
          example: "53.98"
          pattern: "^\\d{1,10}\\.\\d{2}$"
      required:
      - currency
      - itemCount
      - items
      - subtotal
    CartItem:
      type: object
      properties:
        imagePath:
          type: string
          example: /images/plants/frn-birdnest.svg
        lineTotal:
          type: string
          format: decimal
          description: unitPrice × quantity
          example: "53.98"
          pattern: "^\\d{1,8}\\.\\d{2}$"
        maxQuantity:
          type: integer
          format: int32
          description: "min(stock, 10); 0 when out of stock"
          example: 3
          maximum: 10
          minimum: 0
        name:
          type: string
          example: Bird's Nest Fern
        productId:
          type: integer
          format: int64
          example: 11
        quantity:
          type: integer
          format: int32
          example: 2
          maximum: 10
          minimum: 1
        stock:
          type: integer
          format: int32
          example: 3
          minimum: 0
        stockStatus:
          type: string
          enum:
          - OK
          - INSUFFICIENT
          - OUT_OF_STOCK
        unitPrice:
          type: string
          format: decimal
          description: "Current unit price (prices are live, never snapshotted)"
          example: "26.99"
          pattern: "^\\d{1,8}\\.\\d{2}$"
      required:
      - imagePath
      - lineTotal
      - maxQuantity
      - name
      - productId
      - quantity
      - stock
      - stockStatus
      - unitPrice
    Category:
      type: object
      properties:
        code:
          type: string
          example: FERNS
        name:
          type: string
          example: Ferns
      required:
      - code
      - name
    FieldError:
      type: object
      description: One rejected request value (validation-failed problems)
      properties:
        field:
          type: string
          example: size
        message:
          type: string
          example: must be less than or equal to 48
        rejectedValue:
          description: "The rejected value, any JSON type"
          nullable: true
      required:
      - field
      - message
    Me:
      type: object
      properties:
        avatarUrl:
          type: string
          example: https://avatars.githubusercontent.com/u/583231
          nullable: true
        displayName:
          type: string
          example: Octo Cat
        ownerId:
          type: string
          example: github:583231
        provider:
          type: string
          enum:
          - github
          - local
          example: github
      required:
      - displayName
      - ownerId
      - provider
    OAuthError:
      type: object
      properties:
        error:
          type: string
          enum:
          - invalid_request
          - invalid_client
          - invalid_grant
          - unsupported_grant_type
          - temporarily_unavailable
        error_description:
          type: string
      required:
      - error
      - error_description
    PageResponseProduct:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        page:
          type: integer
          format: int32
          example: 0
        query:
          type: string
          example: mon
          nullable: true
        size:
          type: integer
          format: int32
          example: 12
        sort:
          type: string
          example: "name,asc"
        totalElements:
          type: integer
          format: int64
          example: 28
        totalPages:
          type: integer
          format: int32
          example: 3
      required:
      - content
      - page
      - size
      - sort
      - totalElements
      - totalPages
    ProblemDetail:
      type: object
      additionalProperties: true
      description: "RFC 9457 Problem Details. Extension members depend on `code`,\
        \ e.g. `errors` for validation-failed, `minLength`/`maxLength` for invalid-search-term,\
        \ `limit`/`requested`/`productId` for quantity-limit-exceeded. `traceId` identifies\
        \ the request in the server logs."
      properties:
        code:
          type: string
          enum:
          - validation-failed
          - malformed-request
          - invalid-search-term
          - unauthenticated
          - forbidden
          - not-found
          - product-not-found
          - cart-item-not-found
          - method-not-allowed
          - not-acceptable
          - unsupported-media-type
          - out-of-stock
          - quantity-limit-exceeded
          - concurrent-modification
          - rate-limited
          - internal-error
          - auth-provider-unavailable
          example: validation-failed
        detail:
          type: string
          example: One or more request values are invalid.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        instance:
          type: string
          format: uri
          example: /api/v1/products
        limit:
          type: integer
          format: int32
          description: Highest allowed line quantity
          example: 3
        productId:
          type: integer
          format: int64
          description: Product concerned
        requested:
          type: integer
          format: int32
          description: Rejected quantity
          example: 4
        status:
          type: integer
          format: int32
          example: 400
        title:
          type: string
          example: Validation failed
        traceId:
          type: string
          description: "Trace id of the request, for support"
          example: 6f1c2b9a0d4e8f7a6f1c2b9a0d4e8f7a
        type:
          type: string
          format: uri
          example: https://plantshop.example/problems/validation-failed
      required:
      - code
      - status
      - title
      - type
    Product:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/Category"
        currency:
          type: string
          enum:
          - USD
          example: USD
        description:
          type: string
          example: "Glossy, wavy fronds that unfurl from a central rosette like a\
            \ nest."
        id:
          type: integer
          format: int64
          example: 11
        imagePath:
          type: string
          example: /images/plants/frn-birdnest.svg
        light:
          type: string
          enum:
          - LOW
          - MEDIUM
          - BRIGHT_INDIRECT
          - DIRECT
        name:
          type: string
          example: Bird's Nest Fern
        petSafe:
          type: boolean
          example: true
        price:
          type: string
          format: decimal
          description: "Unit price, always two decimals"
          example: "26.99"
          pattern: "^\\d{1,8}\\.\\d{2}$"
        sku:
          type: string
          example: FRN-BIRDNEST
        stock:
          type: integer
          format: int32
          example: 3
          minimum: 0
        watering:
          type: string
          enum:
          - LOW
          - MODERATE
          - HIGH
      required:
      - category
      - currency
      - description
      - id
      - imagePath
      - light
      - name
      - petSafe
      - price
      - sku
      - stock
      - watering
    TokenRequest:
      type: object
      description: application/x-www-form-urlencoded body
      properties:
        client_id:
          type: string
        code:
          type: string
        code_verifier:
          type: string
          maxLength: 128
          minLength: 43
        grant_type:
          type: string
          enum:
          - authorization_code
        redirect_uri:
          type: string
          example: http://127.0.0.1:3000/auth/callback
      required:
      - client_id
      - code
      - code_verifier
      - grant_type
      - redirect_uri
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        scope:
          type: string
          example: read:user
        token_type:
          type: string
          enum:
          - bearer
      required:
      - access_token
      - scope
      - token_type
    UpdateCartItemRequest:
      type: object
      properties:
        quantity:
          type: integer
          format: int32
          example: 3
          maximum: 10
          minimum: 1
      required:
      - quantity
  securitySchemes:
    oauth2:
      description: Authorization Code with PKCE. Local AS (dev/e2e) or GitHub (prod).
      flows:
        authorizationCode:
          authorizationUrl: http://127.0.0.1:8080/oauth2/authorize
          scopes:
            cart.read: Read own cart
            cart.write: Modify own cart
            catalog.read: Read catalog
            openid: OpenID Connect
          tokenUrl: http://127.0.0.1:8080/oauth2/token
      type: oauth2
