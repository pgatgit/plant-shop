# Compose stack used by `docker compose up` (default) and by the E2E suite.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/e2e

app:
  swagger:
    enabled: ${APP_SWAGGER_ENABLED:true}
  auth:
    mode: ${APP_AUTH_MODE:local}
    local:
      user-password: ${APP_LOCAL_USER_PASSWORD:plants-dev-only}
      users:
        - username: shopper
          scopes: [catalog.read, cart.read, cart.write]
        - username: viewer
          scopes: [catalog.read]
        - username: e2e-user-1
          scopes: [catalog.read, cart.read, cart.write]
        - username: e2e-user-2
          scopes: [catalog.read, cart.read, cart.write]
        - username: e2e-user-3
          scopes: [catalog.read, cart.read, cart.write]
        - username: e2e-user-4
          scopes: [catalog.read, cart.read, cart.write]
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:3000}

springdoc:
  swagger-ui:
    oauth:
      client-id: swagger-ui

logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}
