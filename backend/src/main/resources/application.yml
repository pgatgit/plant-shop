# Base configuration shared by all profiles. Every environment-specific value comes from an
# environment variable (12-factor); see docs/plan/08-docker-and-environments.md §4.
spring:
  application:
    name: plant-shop
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: true
  autoconfigure:
    # Users and the Authorization Server are configured explicitly (auth.local, dev/e2e only).
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.security.oauth2.server.authorization.autoconfigure.servlet.OAuth2AuthorizationServerAutoConfiguration
      - org.springframework.boot.security.oauth2.server.authorization.autoconfigure.servlet.OAuth2AuthorizationServerJwtAutoConfiguration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

app:
  auth:
    # github | local | github,local (local only with the dev/e2e profiles)
    mode: ${APP_AUTH_MODE:github}
    local:
      issuer: ${APP_AUTH_LOCAL_ISSUER:http://127.0.0.1:8080}
      spa-redirect-uri: ${APP_AUTH_LOCAL_SPA_REDIRECT_URI:http://127.0.0.1:3000/auth/callback}
      swagger-redirect-uri: ${APP_AUTH_LOCAL_SWAGGER_REDIRECT_URI:http://127.0.0.1:8080/swagger-ui/oauth2-redirect.html}
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    allowed-redirect-uris: ${APP_GITHUB_ALLOWED_REDIRECT_URIS:http://127.0.0.1:3000/auth/callback,http://127.0.0.1:8080/swagger-ui/oauth2-redirect.html}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  rate-limit:
    token-exchange:
      capacity: ${APP_RATE_LIMIT_TOKEN_EXCHANGE_CAPACITY:10}
      refill-period: 1m
  swagger:
    enabled: ${APP_SWAGGER_ENABLED:false}
  openapi:
    server-url: ${APP_OPENAPI_SERVER_URL:http://127.0.0.1:8080}

springdoc:
  api-docs:
    enabled: ${app.swagger.enabled}
    # OpenAPI 3.0 output: supported by the contract validator and openapi-typescript.
    version: openapi_3_0
  swagger-ui:
    enabled: ${app.swagger.enabled}
    persist-authorization: false
    oauth:
      client-id: ${GITHUB_CLIENT_ID:}
      use-pkce-with-authorization-code-grant: true
  default-produces-media-type: application/json
  writer-with-order-by-keys: true

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: false
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
