# Base configuration shared by all profiles. Every environment-specific value comes from an
# environment variable (12-factor); see docs/plan/08-docker-and-environments.md §4.
spring:
  application:
    name: plant-shop
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: true
  autoconfigure:
    # No username/password users: API authentication is bearer-token only (M2).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

app:
  swagger:
    enabled: ${APP_SWAGGER_ENABLED:false}
  openapi:
    server-url: ${APP_OPENAPI_SERVER_URL:http://127.0.0.1:8080}

springdoc:
  api-docs:
    enabled: ${app.swagger.enabled}
    # OpenAPI 3.0 output: supported by the contract validator and openapi-typescript.
    version: openapi_3_0
  swagger-ui:
    enabled: ${app.swagger.enabled}
  default-produces-media-type: application/json
  writer-with-order-by-keys: true

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: false
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
